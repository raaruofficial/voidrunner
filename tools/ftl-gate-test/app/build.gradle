// VOIDRUNNER FTL gate test — the deliverable of this module is the
// androidTest APK (assembleDebugAndroidTest): an AndroidX/UIAutomator
// suite that drives the R-1 gate flow across THREE installed apps
// (the staging shell under test, the Mock MWA Wallet, the system).
// The main APK is an inert stub; nothing here ships to any store.
apply plugin: 'com.android.application'

android {
    namespace 'com.voidrunner.gatetest'
    compileSdk 35

    defaultConfig {
        // applicationId is the APP UNDER TEST's, deliberately: AGP
        // derives the androidTest instrumentation targetPackage from
        // this value, and the <instrumentation> element declared in
        // src/androidTest/AndroidManifest.xml does NOT survive into
        // the built test APK — proven 2026-11-02 by FTL matrix
        // validation (matrix-u8qeipxlyp04a), which read the built
        // APK's targetPackage as 'com.voidrunner.gatetest' and
        // rejected the matrix before any device was provisioned.
        // With this alignment the built test APK carries
        // targetPackage 'com.voidrunner.app' (its own package
        // becomes 'com.voidrunner.app.test'). The driver code has
        // no dependency on its own applicationId: it drives by
        // explicit package constants and the target context.
        applicationId 'com.voidrunner.app'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            // The test APK and the stub share the debug key, exactly
            // what a test instrument needs. The app under test is a
            // separate APK (staging shell) installed alongside.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

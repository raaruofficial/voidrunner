#
# Steps (phone or desktop browser, ~2 minutes):
#   1. Open https://github.com/raaruofficial/voidrunner
#   2. Click "Add file" -> "Create new file"
#   3. In the filename box type exactly:  .github/workflows/android.yml
#   4. Paste this ENTIRE file (comments included are harmless)
#   5. Click "Commit changes..." -> "Commit directly to the main branch"
#
# What happens next:
#   - The push triggers the "Android CI" workflow automatically (Actions tab).
#   - build-debug compiles the APK (~5-10 min) and uploads it as the
#     `voidrunner-debug-apk` artifact (kept 14 days).
#   - Download it from the finished run -> install on the Seeker ->

name: Verify sealed artefact (M8-A remedial lane)

# One-off remedial lane under JUDGE Amendment 2 (build-lineage keeper pass,
# 2026-10-27). NOT part of the tag-triggered Android CI. It builds nothing:
# it downloads the sealed v1.0.2 CI artefact A-1 by id, verifies its sha256
# byte-for-byte against the sealed hash BEFORE any install, and cold-runs
# that exact file through the full cold-run enumeration with the hardened
# script tools/verify-cold-run-m8a.sh. Manual dispatch only, single use.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  verify-artefact-m8a:
    name: M8-A cold run of sealed artefact A-1
    # M8-A2 host (JUDGE Amendment 3, section 4.2): macOS arm64 runner —
    # the ubuntu execution (run 40569832905) died in emulator boot under
    # -accel off software emulation. Script, pin, and asserts unchanged.
    runs-on: macos-14
    timeout-minutes: 90
    env:
      ARTEFACT_ID: "12761853468"
      EXPECTED_SHA256: "fce0171baad53eed25d86e606ec635810fe38047148fe8e5d53ea7d5dc89cabc"
    steps:
      - name: Check out repository (lane files only; the tag tree is untouched)
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Download sealed artefact A-1 by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify-evidence artefact
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$(sha256sum artefact/app-release.apk | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } > verify-evidence/hash-verification.txt
          cat verify-evidence/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install (Amendment 2, step 2)"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: File the instrument (script + its diff vs the tag's script)
        run: |
          cp tools/verify-cold-run-m8a.sh verify-evidence/verify-cold-run-m8a.sh
          git fetch origin tag v1.0.2
          git show v1.0.2:tools/verify-cold-run.sh > /tmp/tag-verify-cold-run.sh
          diff -u /tmp/tag-verify-cold-run.sh tools/verify-cold-run-m8a.sh \
            > verify-evidence/m8a-diff.txt || true
          wc -l verify-evidence/m8a-diff.txt
          git fetch origin b4557993cc7aad9476340c27702f71a5b1190f0c || true
          git show b4557993cc7aad9476340c27702f71a5b1190f0c:.github/workflows/verify-artefact-m8a.yml \
            > /tmp/lane-40569832905.yml 2>/dev/null || true
          diff -u /tmp/lane-40569832905.yml .github/workflows/verify-artefact-m8a.yml \
            > verify-evidence/workflow-diff-vs-40569832905.txt || true

      - name: Record host selection (Amendment 3, section 4.2a)
        run: |
          {
            echo "lane: M8-A2 (JUDGE Amendment 3)"
            echo "runner: macos-14 (GitHub Apple Silicon arm64)"
            echo "system_image_arch: arm64-v8a (required by the arm64 host)"
            echo "profile: pixel_7_pro (unchanged — capture continuity with prior lanes)"
            echo "emulator_boot_timeout: 1200 (raised from 600 per Amendment 3 section 4.2b)"
            echo "reason: the ubuntu execution (run 40569832905) ran the emulator with -accel off"
            echo "  (log: 'Disabling Linux hardware acceleration', no KVM) and the emulator never"
            echo "  became adb-responsive inside the 600s window; the same profile booted in 457s"
            echo "  on a luckier ubuntu draw in the tag runs. macOS arm64 provides hardware"
            echo "  virtualisation (HVF) to the emulator action; the run log must affirmatively"
            echo "  show acceleration NOT disabled."
          } > verify-evidence/host-selection.txt
          cat verify-evidence/host-selection.txt

      - name: Cold-run the sealed artefact on a fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_7_pro
          emulator-boot-timeout: 1200
          script: APK_PATH=$PWD/artefact/app-release.apk bash tools/verify-cold-run-m8a.sh

      - name: Upload M8-A evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-m8a-evidence
          path: verify-evidence/
          retention-days: 90
          if-no-files-found: warn

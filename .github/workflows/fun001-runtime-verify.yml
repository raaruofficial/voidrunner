name: FUN-001 runtime verify (cured v1.0.4)

# v1.0.4 verification lane. Two families, one dispatchable file (a
# workflow_dispatch file must exist on the DEFAULT branch to run at
# all; new workflow files on a side branch return 404 — so both
# families live here and are selected with the `target` input; runs
# execute this file's definition from the dispatched ref):
#
# WALLET VERDICT — SOLANA RESOURCES BINDING 2026-10-29 §2.2 recipe
# against the sealed cured binary + Mock MWA Wallet (pinned commit
# d444aff0, imported THROWAWAY key in repo secret
# MOCK_WALLET_PRIVATE_KEY — devnet/localnet test identity only, never
# an estate key) on PIN-locked AVDs. Suites via
# ./.github/actions/wallet-suite + tools/verify-v104-wallet.sh:
#   core (VR-1/2/3/6/9) · errors (VR-7/8/13) · lifecycle (VR-11/12).
#   API 36 primary, API 35 trailing (core suite).
#
# STANDARD BATTERY legs (binding keeps them separate from the wallet
# verdict), via tools/verify-fun001.sh:
#   battery-webview — Phase C (KFC-003): WebView provider verifiably
#     disabled -> launch + PLAY (first attempt disabled the wrong
#     package — an overlay — and was void; the script now targets the
#     real provider from dumpsys and verifies it is no longer current).
#   battery-lowram — 1024 MB cell: launch + sweep (the ram-size input
#     alone did not take on the first attempt — AVD booted at ~4 GB —
#     so -memory 1024 is passed explicitly and device-info meminfo
#     records what actually ran).
#
# The original brief's no-wallet launch/sweep/connect-tap matrix ran
# 2026-10-29 (run 40953755735: kill cell PASS, API 28 span PASS; the
# API 35 sweep script-FAIL was a Pixel Launcher host ANR artifact —
# app signals clean) and is SUBSUMED by VR-1/VR-11; it is not re-run.
#
# Every job is its own runner (the v1.0.3 combined matrix starved).
# Every job hash-gates the sealed artefact (Android CI 40926367830,
# artefact 12918959892, sha256 d5bff484...f8f) before any install.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which job family to run
        type: choice
        options:
          - wallet-core-api36
          - wallet-all
          - battery
          - everything
        default: wallet-core-api36

permissions:
  contents: read
  actions: read

env:
  ARTEFACT_ID: "12918959892"
  EXPECTED_SHA256: "d5bff484280b361febb488dede18eb2d07372698cd1eff56b13edf69560d0f8f"
  VERSION_STAMP: "v1.0.4 (4)"

jobs:
  # ---------------------------------------------------------------- wallet
  wallet-core-api36:
    name: wallet suite CORE — API 36 (VR-1/2/3/6/9)
    if: ${{ inputs.target == 'wallet-core-api36' || inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: core
          avd-name: vr36-core
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-errors-api36:
    name: wallet suite ERRORS — API 36 (VR-7/8/13)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: errors
          avd-name: vr36-errors
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-lifecycle-api36:
    name: wallet suite LIFECYCLE — API 36 (VR-11/12)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: lifecycle
          avd-name: vr36-lifecycle
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-core-api35:
    name: wallet suite CORE — API 35 trailing (VR-1/2/3/6/9)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "35"
          suite: core
          avd-name: vr35-core
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- battery
  battery-webview:
    name: battery — Phase C WebView-disabled (API 35)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.4 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v104-battery-webview
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v104-battery-webview/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Phase C on API 35 (WebView provider disabled, launch + PLAY)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v104-webview
          force-avd-creation: true
          emulator-boot-timeout: 1200
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v104-battery-webview FUN001_PHASES=AC FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-webview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v104-battery-webview
          path: fun001-v104-battery-webview/
          retention-days: 90
          if-no-files-found: warn

  battery-lowram:
    name: battery — low RAM 1024 MB (API 35)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.4 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v104-battery-lowram
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v104-battery-lowram/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Low-RAM run on API 35 (1024 MB, phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v104-lowram
          force-avd-creation: true
          emulator-boot-timeout: 1200
          ram-size: 1024
          emulator-options: -memory 1024
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v104-battery-lowram FUN001_PHASES=AB FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-lowram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v104-battery-lowram
          path: fun001-v104-battery-lowram/
          retention-days: 90
          if-no-files-found: warn

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.4 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v104-evidence-sweep35
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v104-evidence-sweep35/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Sweep run on API 35 (phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: fun001-v104-sweep35
          force-avd-creation: true
          emulator-boot-timeout: 1200
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v104-evidence-sweep35 FUN001_PHASES=AB FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v104-evidence-sweep35
          path: fun001-v104-evidence-sweep35/

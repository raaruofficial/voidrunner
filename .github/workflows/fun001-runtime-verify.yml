name: FUN-001 runtime verify (cured v1.0.7)

# v1.0.6 verification lane — the FULL §2.2 candidate-verdict run against
# the sealed v1.0.6 binary (commit 90c5131: v1.0.5 + KFC-006 Base58
# codec cure only). Two families, one dispatchable file (a
# workflow_dispatch file must exist on the DEFAULT branch to run at
# all; new workflow files on a side branch return 404 — so both
# families live here and are selected with the `target` input; runs
# execute this file's definition from the dispatched ref):
#
# WALLET VERDICT — SOLANA RESOURCES BINDING 2026-10-29 §2.2 recipe
# against the sealed cured binary + Mock MWA Wallet (pinned commit
# d444aff0, imported THROWAWAY key in repo secret
# MOCK_WALLET_PRIVATE_KEY — devnet/localnet test identity only, never
# an estate key) on PIN-locked AVDs. Suites via
# ./.github/actions/wallet-suite + tools/verify-v104-wallet.sh:
#   core (VR-1/2/3/6/9) · errors (VR-7/8/13) · lifecycle (VR-11/12).
#   API 36 primary, API 35 trailing (core suite).
#
# STANDARD BATTERY legs (binding keeps them separate from the wallet
# verdict), via tools/verify-fun001.sh:
#   battery-webview — Phase C (KFC-003): WebView provider verifiably
#     disabled -> launch + PLAY (first attempt disabled the wrong
#     package — an overlay — and was void; the script now targets the
#     real provider from dumpsys and verifies it is no longer current).
#   battery-lowram — 1024 MB cell: launch + sweep (neither the
#     ram-size input nor -memory ever took downward — AVDs booted at
#     ~4 GB — so the v1.0.7 lane pre-creates the AVD and sets
#     hw.ramSize=1024 in its config.ini; device-info meminfo records
#     what actually ran and the cell grades on that measurement).
#   battery-sweep-api36 / battery-sweep-api35 — fresh-install first
#     launch + full menu sweep (phases A+B, REPORT.md method) on each
#     AVD, standard RAM; the v1.0.6 candidate verdict requires the
#     battery on THIS binary, not the subsumed v1.0.3 matrix.
#
# The original brief's no-wallet launch/sweep/connect-tap matrix ran
# 2026-10-29 (run 40953755735: kill cell PASS, API 28 span PASS; the
# API 35 sweep script-FAIL was a Pixel Launcher host ANR artifact —
# app signals clean) and is SUBSUMED by VR-1/VR-11; it is not re-run.
#
# Every job is its own runner (the v1.0.3 combined matrix starved).
# Every job hash-gates the sealed artefact (Android CI 41003669903,
# artefact 12954756002, sha256 4253c7ce...3580) before any install.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which job family to run
        type: choice
        options:
          - wallet-core-api36
          - wallet-all
          - battery
          - battery-webview
          - battery-lowram
          - lifecycle-api36
          - battery-sweep-api36
          - battery-sweep-api35
          - everything
        default: wallet-core-api36

permissions:
  contents: read
  actions: read

env:
  ARTEFACT_ID: "12954756002"
  EXPECTED_SHA256: "4253c7ce63eded08666383aa347424001a8f60064be640f241609ff071c23580"
  VERSION_STAMP: "v1.0.7 (7)"

jobs:
  # ---------------------------------------------------------------- wallet
  wallet-core-api36:
    name: wallet suite CORE — API 36 (VR-1/2/3/6/9)
    if: ${{ inputs.target == 'wallet-core-api36' || inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: core
          avd-name: vr36-core
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-errors-api36:
    name: wallet suite ERRORS — API 36 (VR-7/8/13)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: errors
          avd-name: vr36-errors
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-lifecycle-api36:
    name: wallet suite LIFECYCLE — API 36 (VR-11/12)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' || inputs.target == 'lifecycle-api36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "36"
          suite: lifecycle
          avd-name: vr36-lifecycle
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  wallet-core-api35:
    name: wallet suite CORE — API 35 trailing (VR-1/2/3/6/9)
    if: ${{ inputs.target == 'wallet-all' || inputs.target == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wallet-suite
        with:
          api-level: "35"
          suite: core
          avd-name: vr35-core
          mock-private-key: ${{ secrets.MOCK_WALLET_PRIVATE_KEY }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- battery
  battery-webview:
    name: battery — Phase C WebView-disabled (API 35)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' || inputs.target == 'battery-webview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libegl1 libnss3 libxcb-cursor0 > /dev/null

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.7 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v107-battery-webview
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v107-battery-webview/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Phase C on API 35 (WebView provider disabled, launch + PLAY)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v107-webview
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v107-battery-webview FUN001_PHASES=AC FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-webview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v107-battery-webview
          path: fun001-v107-battery-webview/
          retention-days: 90
          if-no-files-found: warn

  battery-lowram:
    name: battery — low RAM 1024 MB (API 35)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' || inputs.target == 'battery-lowram' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libegl1 libnss3 libxcb-cursor0 > /dev/null

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.7 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v107-battery-lowram
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v107-battery-lowram/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Pre-create low-RAM AVD with hw.ramSize=1024 in config.ini
        run: |
          # r10.1: the first v1.0.7 attempt died silently inside this
          # step (sdkmanager output was piped to /dev/null, and the
          # evidence dir did not exist yet for the closing tee). This
          # version creates the evidence dir first, narrates every
          # sub-step into the job log AND an evidence file, tolerates
          # sdkmanager noise, and fails only on the final verification
          # (config.ini exists + ramSize set).
          mkdir -p fun001-v107-battery-lowram
          exec > >(tee -a fun001-v107-battery-lowram/avd-create.log) 2>&1
          set -uo pipefail
          # v1.0.7 verdict tasking: the ram-size input / -memory flag
          # never took downward on this lane (the v1.0.4-v1.0.6 low-RAM
          # AVDs all booted at ~4 GB despite both). Control the RAM
          # through the AVD's own config.ini instead: create the AVD
          # here, set hw.ramSize=1024, and let the runner step below
          # REUSE it (force-avd-creation: false). The job's
          # device-info.txt (/proc/meminfo) records what actually
          # booted — the cell is graded on that measurement, never on
          # this request.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo "sdk_root=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls "$ANDROID_HOME/system-images/android-35/google_apis" || echo "API35 google_apis image not preinstalled"
          java -version 2>&1 | head -2 || echo "no java on PATH"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" ]; then
            echo "installing system-images;android-35;google_apis;x86_64 ..."
            "$SDKM" "system-images;android-35;google_apis;x86_64" || echo "sdkmanager install rc=$? (continuing; avdmanager will judge)"
          else
            echo "system image already present on the runner image"
          fi
          echo no | "$AVDM" create avd -n v107-lowram -k "system-images;android-35;google_apis;x86_64" -d pixel_7_pro --force || echo no | "$AVDM" create avd -n v107-lowram -k "system-images;android-35;google_apis;x86_64" --force
          CFG="$HOME/.android/avd/v107-lowram.avd/config.ini"
          if [ ! -f "$CFG" ]; then
            echo "FATAL: AVD config.ini was not created"
            exit 1
          fi
          if grep -q "^hw.ramSize=" "$CFG"; then
            sed -i 's/^hw.ramSize=.*/hw.ramSize=1024/' "$CFG"
          else
            echo "hw.ramSize=1024" >> "$CFG"
          fi
          {
            echo "avd_config_ini=$CFG"
            grep -E "^hw.ramSize=" "$CFG" || true
            grep -E "^hw.device.name=|^image.sysdir.1=" "$CFG" || true
          } | tee fun001-v107-battery-lowram/avd-config.txt

      - name: Low-RAM run on API 35 (1024 MB, phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v107-lowram
          force-avd-creation: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v107-battery-lowram FUN001_PHASES=AB FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-lowram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v107-battery-lowram
          path: fun001-v107-battery-lowram/
          retention-days: 90
          if-no-files-found: warn

  battery-sweep-api36:
    name: battery — first launch + menu sweep (API 36)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' || inputs.target == 'battery-sweep-api36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libegl1 libnss3 libxcb-cursor0 > /dev/null

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.7 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v107-battery-sweep-api36
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v107-battery-sweep-api36/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: First launch + menu sweep on API 36 (phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v107-sweep36
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v107-battery-sweep-api36 FUN001_PHASES=AB FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-sweep-api36 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v107-battery-sweep-api36
          path: fun001-v107-battery-sweep-api36/
          retention-days: 90
          if-no-files-found: warn

  battery-sweep-api35:
    name: battery — first launch + menu sweep (API 35)
    if: ${{ inputs.target == 'battery' || inputs.target == 'everything' || inputs.target == 'battery-sweep-api35' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 libgl1 libegl1 libnss3 libxcb-cursor0 > /dev/null

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.7 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v107-battery-sweep-api35
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v107-battery-sweep-api35/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: First launch + menu sweep on API 35 (phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v107-sweep35
          force-avd-creation: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v107-battery-sweep-api35 FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-sweep-api35 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v107-battery-sweep-api35
          path: fun001-v107-battery-sweep-api35/
          retention-days: 90
          if-no-files-found: warn

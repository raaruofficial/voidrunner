name: FUN-001 runtime verify (cured v1.0.4) — standard battery legs

# The no-wallet launch/sweep/connect-tap matrix from the original v1.0.4
# brief ran 2026-10-29 (run 40953755735: kill cell PASS, API 28 span
# PASS; sweep/low-RAM script-FAILs traced to a Pixel Launcher host ANR
# dialog in 3 of 5 parallel jobs — host wedge, app signals clean) and is
# now SUBSUMED by the §2.2 wallet verdict in fun001-v104-wallet.yml
# (VR-1/VR-11). What remains here are the two standard-battery legs the
# binding keeps separate from the wallet verdict:
#   battery-webview — Phase C (KFC-003): WebView provider verifiably
#     disabled -> launch + PLAY. First attempt disabled the wrong package
#     (an overlay) and the leg was void; the script now targets the real
#     provider from dumpsys and verifies it is no longer current before
#     launching.
#   battery-lowram — 1024 MB cell: launch + sweep. The ram-size input
#     alone did not take on the first attempt (AVD still booted at
#     ~4 GB), so -memory 1024 is passed explicitly and the device-info
#     meminfo in the evidence records what actually ran.
#
# Both jobs run tools/verify-fun001.sh against the same sealed artefact
# (Android CI 40926367830, artefact 12918959892) with the in-step hash
# gate. Jobs are separate runners by design.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ARTEFACT_ID: "12918959892"
  EXPECTED_SHA256: "d5bff484280b361febb488dede18eb2d07372698cd1eff56b13edf69560d0f8f"
  VERSION_STAMP: "v1.0.4 (4)"

jobs:
  battery-webview:
    name: battery — Phase C WebView-disabled (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.4 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v104-battery-webview
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v104-battery-webview/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Phase C on API 35 (WebView provider disabled, launch + PLAY)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v104-webview
          force-avd-creation: true
          emulator-boot-timeout: 1200
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v104-battery-webview FUN001_PHASES=AC FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-webview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v104-battery-webview
          path: fun001-v104-battery-webview/
          retention-days: 90
          if-no-files-found: warn

  battery-lowram:
    name: battery — low RAM 1024 MB (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository (lane files only)
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download v1.0.4 artefact by id and verify its hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artefact fun001-v104-battery-lowram
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTEFACT_ID}/zip" > artefact.zip
          unzip -o artefact.zip -d artefact
          ls -la artefact
          ACTUAL="$( (sha256sum artefact/app-release.apk 2>/dev/null || shasum -a 256 artefact/app-release.apk) | awk '{print $1}')"
          {
            echo "artefact_id=${ARTEFACT_ID}"
            echo "expected_sha256=${EXPECTED_SHA256}"
            echo "actual_sha256=${ACTUAL}"
          } | tee fun001-v104-battery-lowram/hash-verification.txt
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "HASH MISMATCH — lane aborts before install"
            exit 1
          fi
          echo "Hash verified byte-for-byte; proceeding to cold run."

      - name: Low-RAM run on API 35 (1024 MB, phases A+B)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: v104-lowram
          force-avd-creation: true
          emulator-boot-timeout: 1200
          ram-size: 1024
          emulator-options: -memory 1024
          script: APK_PATH=$PWD/artefact/app-release.apk FUN001_OUT=$PWD/fun001-v104-battery-lowram FUN001_PHASES=AB FUN001_VERSION_STAMP='${{ env.VERSION_STAMP }}' bash tools/verify-fun001.sh

      - name: Upload battery-lowram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fun001-v104-battery-lowram
          path: fun001-v104-battery-lowram/
          retention-days: 90
          if-no-files-found: warn

name: VOIDRUNNER gate suite (v1.0.13 cure R-1/R-2)
description: >
  The §2 gate cell: builds the pinned Mock MWA Wallet, hash-gates the
  APK under test, starts the serving rig (candidate static bytes at
  the production hostname via a run-local CA; everything else proxied
  to the upstream origin), performs the trust-store + hosts
  surgery on a PIN-locked API 36 AVD, and runs
  tools/verify-gate-wallet.sh. The APK run/artefact come from the
  FUN001_APK_RUN_ID / FUN001_APK_ARTIFACT env (workflow pins); the
  hash gate uses the caller job's EXPECTED_SHA256 / VERSION_STAMP env.
  server-mode selects the upstream: "production" (the real origin) or
  "staging" — the R-1/R-2 COMPOSITION of the owner's 2026-11-01
  ruling: the production server bundle running on the runner with
  the ANS registry seam stubbed for the one fixture handle
  (tools/gate-staging/), because no .skr fixture can exist for a
  test wallet under Solana Mobile's documented minting rules.
inputs:
  api-level:
    description: Android API level for the AVD
    required: false
    default: "36"
  avd-name:
    description: AVD name
    required: true
  mock-private-key:
    description: Mock wallet throwaway private key (repo secret)
    required: true
  gate-mode:
    description: "r1 (cured candidate, bind+proof reps) or r2 (negative control)"
    required: true
  serve-dir:
    description: Repo-relative dir whose bytes the rig serves as the client
    required: true
  served-asset:
    description: JS asset filename the device must fetch through the rig
    required: true
  gate-handle:
    description: Lane-designated fixture handle (full form, name.skr)
    required: true
  server-mode:
    description: "production (real origin upstream) or staging (composition: production server bundle on the runner, registry seam stubbed for the fixture handle)"
    required: false
    default: "production"
  fixture-owner:
    description: Pubkey the staging registry seam names as the fixture handle's owner (staging mode only; the Mock wallet key)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve Mock MWA Wallet ref (pinned in-repo)
      id: mockref
      shell: bash
      run: |
        REF="$(tr -d '[:space:]' < tools/mockwallet-ref.txt)"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
        echo "Mock MWA Wallet ref: $REF"
    - name: Cache Mock MWA Wallet checkout
      id: mockcache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/mockwallet-src
        key: mockwallet-${{ steps.mockref.outputs.ref }}-v2
    - name: Check out Mock MWA Wallet (pinned)
      if: steps.mockcache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone https://github.com/solana-mobile/mock-mwa-wallet.git "${RUNNER_TEMP}/mockwallet-src"
        git -C "${RUNNER_TEMP}/mockwallet-src" checkout "${{ steps.mockref.outputs.ref }}"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.11.1"
    - name: Decode mock wallet key + build Mock MWA Wallet
      shell: bash
      env:
        MOCK_WALLET_PRIVATE_KEY: ${{ inputs.mock-private-key }}
      run: |
        mkdir -p "${RUNNER_TEMP}/mockwallet-src/app/src/main/res/raw"
        printf '%s' "$MOCK_WALLET_PRIVATE_KEY" \
          | base64 --decode \
          > "${RUNNER_TEMP}/mockwallet-src/app/src/main/res/raw/private_key"
        cd "${RUNNER_TEMP}/mockwallet-src"
        # Build with the mock repo's own wrapper (the wallet-suite
        # recipe): the pinned system Gradle 8.11.1 cannot apply the
        # mock's AGP 8.13.0 — gate-r1 run 41374411883 died on exactly
        # that; the wrapper carries the compatible distribution.
        chmod +x gradlew
        ./gradlew :app:assembleDebug --console=plain --no-daemon
        MOCK_APK="$(find "${RUNNER_TEMP}/mockwallet-src/app/build/outputs/apk" -name '*.apk' | head -n 1)"
        echo "MOCK_APK=$MOCK_APK" >> "$GITHUB_ENV"
        echo "Mock wallet built: $MOCK_APK"
    - name: Download sealed APK artefact + verify its sha256
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        echo "Hash gate: run=${FUN001_APK_RUN_ID} artefact=${FUN001_APK_ARTIFACT} stamp=${VERSION_STAMP}"
        mkdir -p "${RUNNER_TEMP}/vr-apk"
        gh run download "${FUN001_APK_RUN_ID}" --name "${FUN001_APK_ARTIFACT}" --dir "${RUNNER_TEMP}/vr-apk"
        VR_APK="$(find "${RUNNER_TEMP}/vr-apk" -name '*.apk' | head -n 1)"
        echo "Downloaded: $VR_APK"
        ACTUAL="$(sha256sum "$VR_APK" | cut -d' ' -f1)"
        echo "sha256: $ACTUAL (expected ${EXPECTED_SHA256})"
        if [ "$ACTUAL" != "${EXPECTED_SHA256}" ]; then
          echo "::error::APK hash mismatch — refusing to test an unsealed binary"
          exit 1
        fi
        echo "VR_APK=$VR_APK" >> "$GITHUB_ENV"
    - name: Resolve gate origins (server-mode)
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.server-mode }}" = "staging" ]; then
          echo "GATE_ORIGIN=http://127.0.0.1:8791" >> "$GITHUB_ENV"
          echo "RIG_UPSTREAM=http://127.0.0.1:8791" >> "$GITHUB_ENV"
          echo "server-mode=staging (composition): read-backs + rig proxy target the on-runner staging server"
        else
          echo "GATE_ORIGIN=https://voidrunner-2hm7p.ondigitalocean.app" >> "$GITHUB_ENV"
          echo "RIG_UPSTREAM=https://voidrunner-2hm7p.ondigitalocean.app" >> "$GITHUB_ENV"
          echo "server-mode=production: read-backs + rig proxy target the real origin"
        fi
    - name: Set up Bun (staging server runtime)
      if: inputs.server-mode == 'staging'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.10"
    - name: Staging server — fetch the production bundle + build the seamed module
      if: inputs.server-mode == 'staging'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/staging"
        # The production server bundle is a RELEASE ASSET, never a git
        # blob: it carries server-only config, and GitHub push
        # protection (correctly) refuses it in history. apply-seam.py
        # hash-gates it against the bundle of record before use.
        gh release download gate-staging-fixtures-v1 \
          --pattern "server-actions.production.js" \
          --dir "${RUNNER_TEMP}/staging"
        echo "GATE_BUNDLE_PATH=${RUNNER_TEMP}/staging/server-actions.production.js" >> "$GITHUB_ENV"
        python3 tools/gate-staging/apply-seam.py \
          "${RUNNER_TEMP}/staging/server-actions.production.js" \
          "${RUNNER_TEMP}/staging/server-actions.staging.js" \
          | tee "${RUNNER_TEMP}/staging/seam-record.txt"
        echo "fixture handle: ${{ inputs.gate-handle }}" >> "${RUNNER_TEMP}/staging/seam-record.txt"
        echo "fixture owner (registry seam): ${{ inputs.fixture-owner }}" >> "${RUNNER_TEMP}/staging/seam-record.txt"
        cat "${RUNNER_TEMP}/staging/seam-record.txt"
    - name: Staging server — janitor asserts a clean fixture slate
      if: inputs.server-mode == 'staging'
      shell: bash
      env:
        VR_GATE_FIXTURE_HANDLE: ${{ inputs.gate-handle }}
      run: |
        set -euo pipefail
        bash tools/gate-staging/janitor.sh assert-clean "$GATE_BUNDLE_PATH"
    - name: Staging server — start + health + runner-side smoke
      if: inputs.server-mode == 'staging'
      shell: bash
      env:
        VR_GATE_SERVER_MODULE: ${{ runner.temp }}/staging/server-actions.staging.js
        VR_GATE_FIXTURE_HANDLE: ${{ inputs.gate-handle }}
        VR_GATE_FIXTURE_OWNER: ${{ inputs.fixture-owner }}
        VR_GATE_STAGING_PORT: "8791"
      run: |
        set -euo pipefail
        nohup bun tools/gate-staging/staging-server.ts > "${RUNNER_TEMP}/staging/staging-server.log" 2>&1 &
        for i in $(seq 1 30); do
          if curl -s http://127.0.0.1:8791/health > "${RUNNER_TEMP}/staging/health.json" 2>/dev/null; then break; fi
          sleep 2
        done
        cat "${RUNNER_TEMP}/staging/health.json"
        grep -q '"ok":true' "${RUNNER_TEMP}/staging/health.json"
        # Runner-side smoke: the fixture handle must answer bind_required
        # with the seam's owner BEFORE any device time is spent.
        curl -s -X POST http://127.0.0.1:8791/actions -H 'Content-Type: application/json' \
          -d "{\"action\":\"signIn\",\"args\":{\"name\":\"${{ inputs.gate-handle }}\"},\"actionCallId\":\"staging-smoke\"}" \
          > "${RUNNER_TEMP}/staging/staging-smoke.json"
        cat "${RUNNER_TEMP}/staging/staging-smoke.json"
        python3 - "${RUNNER_TEMP}/staging/staging-smoke.json" "${{ inputs.fixture-owner }}" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1]))
        data = d.get("data") or {}
        assert data.get("status") == "bind_required", f"smoke: expected bind_required, got {d}"
        assert data.get("ownerPubkey") == sys.argv[2], f"smoke: seam owner mismatch: {d}"
        print("staging smoke PASS: bind_required with the fixture owner")
        PY
    - name: Serving rig — CA, leaf cert, start
      shell: bash
      run: |
        set -euo pipefail
        HOST="voidrunner-2hm7p.ondigitalocean.app"
        RIG_DIR="${RUNNER_TEMP}/rig"
        mkdir -p "$RIG_DIR"
        # Run-local CA (never leaves the runner; the emulator store copy
        # dies with the AVD).
        openssl req -x509 -newkey rsa:2048 -keyout "$RIG_DIR/ca.key" -out "$RIG_DIR/ca.crt" \
          -days 2 -nodes -subj "/CN=VOIDRUNNER gate rig CA" 2>/dev/null
        # Leaf for the production hostname, SAN-signed by the CA.
        openssl req -newkey rsa:2048 -keyout "$RIG_DIR/leaf.key" -out "$RIG_DIR/leaf.csr" \
          -nodes -subj "/CN=$HOST" 2>/dev/null
        printf 'subjectAltName=DNS:%s\n' "$HOST" > "$RIG_DIR/san.cnf"
        openssl x509 -req -in "$RIG_DIR/leaf.csr" -CA "$RIG_DIR/ca.crt" -CAkey "$RIG_DIR/ca.key" \
          -CAcreateserial -out "$RIG_DIR/leaf.crt" -days 2 -extfile "$RIG_DIR/san.cnf" 2>/dev/null
        cat "$RIG_DIR/leaf.crt" "$RIG_DIR/leaf.key" > "$RIG_DIR/leaf.pem"
        echo "GATE_CA_CRT=$RIG_DIR/ca.crt" >> "$GITHUB_ENV"
        echo "RIG_LOG=$RIG_DIR/rig.log" >> "$GITHUB_ENV"
        sudo nohup python3 tools/gate-rig.py \
          --cert "$RIG_DIR/leaf.pem" --key "$RIG_DIR/leaf.pem" \
          --serve "${{ inputs.serve-dir }}" \
          --upstream "$RIG_UPSTREAM" --port 443 \
          > "$RIG_DIR/rig.log" 2>&1 &
        sleep 2
        head -n 2 "$RIG_DIR/rig.log" || true
        curl -sk --cacert "$RIG_DIR/ca.crt" "https://$HOST:443/" --resolve "$HOST:443:127.0.0.1" \
          -o /dev/null -w 'rig self-check: HTTP %{http_code}\n' || echo "rig self-check FAILED (see rig log in evidence)"
    - name: Write gate runner wrapper (rig surgery + driver)
      shell: bash
      run: |
        cat > "${RUNNER_TEMP}/gate-run.sh" <<'WRAP'
        #!/usr/bin/env bash
        # Runs INSIDE the emulator-runner step, device up. Performs the
        # trust-store + hosts surgery, restarts the framework so new
        # processes pick up the store, then execs the gate driver.
        set -x
        adb root || true
        adb wait-for-device
        HASH="$(openssl x509 -subject_hash_old -in "$GATE_CA_CRT" | sed -n '1p')"
        adb shell 'rm -rf /data/local/tmp/vr-cacerts; mkdir -p /data/local/tmp/vr-cacerts; cp /apex/com.android.conscrypt/cacerts/* /data/local/tmp/vr-cacerts/ 2>/dev/null; cp /system/etc/security/cacerts/* /data/local/tmp/vr-cacerts/ 2>/dev/null; ls /data/local/tmp/vr-cacerts | wc -l'
        adb push "$GATE_CA_CRT" "/data/local/tmp/vr-cacerts/${HASH}.0"
        adb shell 'mount -o bind /data/local/tmp/vr-cacerts /apex/com.android.conscrypt/cacerts' || echo "CA_MOUNT_APEX_FAILED"
        adb shell 'mount -o bind /data/local/tmp/vr-cacerts /system/etc/security/cacerts' || echo "CA_MOUNT_SYSTEM_FAILED"
        adb shell 'cp /system/etc/hosts /data/local/tmp/vr-hosts && echo "10.0.2.2 voidrunner-2hm7p.ondigitalocean.app" >> /data/local/tmp/vr-hosts && mount -o bind /data/local/tmp/vr-hosts /system/etc/hosts' || echo "HOSTS_MOUNT_FAILED"
        adb shell stop || true
        sleep 3
        adb shell start || true
        adb wait-for-device
        for i in $(seq 1 60); do
          [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
          sleep 3
        done
        adb shell ping -c 1 -w 5 voidrunner-2hm7p.ondigitalocean.app || echo "RIG_PING_FAILED"
        exec ./tools/verify-gate-wallet.sh
        WRAP
        chmod +x "${RUNNER_TEMP}/gate-run.sh"
    - name: Gate cell — rig-served client, PIN-locked AVD (API ${{ inputs.api-level }})
      uses: reactivecircus/android-emulator-runner@v2
      env:
        OUT: gate-evidence
        GATE_MODE: ${{ inputs.gate-mode }}
        GATE_HANDLE: ${{ inputs.gate-handle }}
        SERVED_ASSET: ${{ inputs.served-asset }}
        ORIGIN: ${{ env.GATE_ORIGIN }}
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        profile: pixel_6
        avd-name: ${{ inputs.avd-name }}
        cores: 2
        ram-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
        disable-animations: true
        script: ${{ runner.temp }}/gate-run.sh
    - name: Staging server — janitor sweep + collect staging evidence
      if: always() && inputs.server-mode == 'staging'
      shell: bash
      env:
        VR_GATE_FIXTURE_HANDLE: ${{ inputs.gate-handle }}
      run: |
        mkdir -p gate-evidence
        bash tools/gate-staging/janitor.sh sweep "$GATE_BUNDLE_PATH" \
          | tee gate-evidence/janitor-sweep.txt || echo "janitor sweep FAILED — see janitor-sweep.txt" | tee -a gate-evidence/janitor-sweep.txt
        cp "${RUNNER_TEMP}/staging/staging-server.log" gate-evidence/staging-server.log 2>/dev/null || true
        cp "${RUNNER_TEMP}/staging/seam-record.txt" gate-evidence/seam-record.txt 2>/dev/null || true
        cp "${RUNNER_TEMP}/staging/staging-smoke.json" gate-evidence/staging-smoke.json 2>/dev/null || true
        cp "${RUNNER_TEMP}/staging/health.json" gate-evidence/staging-health.json 2>/dev/null || true
    - name: Upload gate evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gate-evidence-${{ inputs.gate-mode }}-${{ inputs.avd-name }}
        path: |
          gate-evidence/**
          ${{ runner.temp }}/rig/rig.log
        retention-days: 90
